# n8n workflow automation, local only. UI/API on 127.0.0.1:5678 (reach from the laptop via SSH tunnel).
services:
  n8n:
    image: n8nio/n8n:2.48.7
    container_name: n8n
    restart: unless-stopped
    environment:
      TZ: America/Vancouver
      GENERIC_TIMEZONE: America/Vancouver
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false" # plain http on localhost
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - ./data:/home/node/.n8n
      - ./files:/home/node/.n8n-files
